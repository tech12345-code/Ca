name: Build Android Debug APK & Publish Release

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build Smart Expense Manager Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK 35
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK_DIR" ] || [ ! -w "$SDK_DIR" ]; then
            SDK_DIR="$HOME/android-sdk"
            mkdir -p "$SDK_DIR"
          fi
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"
            curl -sSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-extract
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdline-extract/cmdline-tools "$SDK_DIR/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-extract
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          gradle-home-cache-cleanup: true

      - name: Run Android unit tests and assemble Debug APK
        working-directory: android-project
        run: |
          if [ -x ./gradlew ]; then
            ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
          else
            gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
          fi

      - name: Prepare named APK for download
        run: |
          mkdir -p dist-apk
          cp android-project/app/build/outputs/apk/debug/app-debug.apk dist-apk/SmartExpenseManager-debug.apk
          ls -lh dist-apk/SmartExpenseManager-debug.apk

      - name: Upload Debug APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartExpenseManager-debug-apk
          path: dist-apk/SmartExpenseManager-debug.apk
          retention-days: 30

      - name: Publish Debug APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-debug
          name: Smart Expense Manager Debug APK (Build #${{ github.run_number }})
          body: |
            Automated Debug APK build for **Smart Expense Manager** from commit `${{ github.sha }}`.

            Direct APK Download:
            `https://github.com/${{ github.repository }}/releases/latest/download/SmartExpenseManager-debug.apk`
          draft: false
          prerelease: false
          make_latest: true
          files: |
            dist-apk/SmartExpenseManager-debug.apk
